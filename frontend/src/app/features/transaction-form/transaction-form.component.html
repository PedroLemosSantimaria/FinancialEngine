<div class="page">
  <div class="page__header">
    <a mat-icon-button [routerLink]="['/accounts', accountId, 'statement']" aria-label="Voltar">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h1>Nova transação</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="type">
        <mat-option value="Credit">Crédito</mat-option>
        <mat-option value="Debit">Débito</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor</mat-label>
      <span matTextPrefix>R$&nbsp;</span>
      <input matInput type="number" step="0.01" formControlName="amount" placeholder="0,00" />
      <mat-error *ngIf="form.controls.amount.hasError('required')">
        Informe o valor da transação.
      </mat-error>
      <mat-error *ngIf="form.controls.amount.hasError('min')">
        O valor deve ser maior que zero.
      </mat-error>
    </mat-form-field>

    <div class="form__actions">
      <button mat-stroked-button type="button" [routerLink]="['/accounts', accountId, 'statement']">
        Cancelar
      </button>
      <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
        <mat-spinner *ngIf="isSubmitting" diameter="20" class="btn-spinner"></mat-spinner>
        <span *ngIf="!isSubmitting">Confirmar</span>
      </button>
    </div>
  </form>
</div>
