<div class="page">
  <h1>Contas</h1>

  <div *ngIf="isLoading" class="state state--loading">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Carregando contas...</span>
  </div>

  <div *ngIf="errorMessage" class="state state--error">
    <mat-icon>error_outline</mat-icon>
    <span>{{ errorMessage }}</span>
    <button mat-stroked-button (click)="loadAccounts()">Tentar novamente</button>
  </div>

  <div *ngIf="!isLoading && !errorMessage && accounts.length === 0" class="state">
    <span>Nenhuma conta cadastrada.</span>
  </div>

  <div class="accounts-grid" *ngIf="!isLoading && !errorMessage">
    <mat-card *ngFor="let account of accounts" class="account-card" (click)="openStatement(account.id)">
      <mat-card-header>
        <mat-card-title>{{ account.owner }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="balance">R$ {{ account.balance | number: '1.2-2' }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary">Ver extrato</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
